[project]
name = "klima-data"
version = "0.1.0"
description = "Klima ETL: PAGASA bronze ingest and DuckDB medallion warehouse"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.4.1",
    "pandas>=2.3.3",
    "requests>=2.32.5",
]

[project.scripts]
klima-etl = "pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]
