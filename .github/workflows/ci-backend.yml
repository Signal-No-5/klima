name: Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"

defaults:
  run:
    working-directory: backend

jobs:
  test:
    name: Backend suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --extra test
      - name: Ruff (lint)
        # Gate app + tests; pipeline has pre-existing tab/style debt from source history.
        run: uv run ruff check --no-fix app tests
      - name: Pytest
        run: uv run pytest -q --tb=short
