name: Docs CI

on:
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/ci-docs.yml"
  push:
    branches: [main, feat/mvp-flatten]
    paths:
      - "docs/**"
      - ".github/workflows/ci-docs.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Install + build
        run: |
          pnpm install
          pnpm docs:build
