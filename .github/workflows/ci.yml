name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  layout:
    name: Monorepo layout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: pip install pytest
      - name: Check layout
        run: pytest -q tests/test_monorepo_layout.py

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --extra test
      - name: Run tests
        run: uv run pytest -q
