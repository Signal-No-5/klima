[project]
name = "klima-schema"
version = "0.1.0"
description = "Canonical Klima API wire contracts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.12.0"]

[project.scripts]
klima-schema-export = "klima_schema.export:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["klima_schema"]
