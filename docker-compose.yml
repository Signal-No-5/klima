# Local multi-surface stack for Klima MVP deploys.
# Primary production targets: Fly (backend), Vercel (frontend + docs).
# See deploy/README.md.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8080"
    environment:
      APP_NAME: klima-api
      APP_MODE: development
      APP_PORT: "8080"
      DB_DIALECT: sqlite
      SQLITE_FILE: /tmp/klima.db
      LOG_LEVEL: INFO
      # Secrets: copy from backend/.env.example into a local .env — never commit.
      SECRET_KEY: local-dev-only-change-me
      JWT_SECRET_KEY: local-dev-only-change-me
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Optional local previews (production hosts are Vercel).
  frontend:
    profiles: ["web"]
    image: node:22-bookworm-slim
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "corepack enable && pnpm install && pnpm dev --hostname 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy

  docs:
    profiles: ["web"]
    image: node:22-bookworm-slim
    working_dir: /app
    volumes:
      - ./docs:/app
    command: sh -c "corepack enable && pnpm install && pnpm docs:dev --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
