[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.17.0",
    "casbin>=1.43.0",
    "duckdb>=1.4.1",
    "fastapi[all]>=0.119.0",
    "klima-schema",
    "loguru>=0.7.3",
    "pandas>=2.3.3",
    "passlib[bcrypt]>=1.7.4",
    "prometheus-fastapi-instrumentator>=7.1.0",
    "psycopg2-binary>=2.9.11",
    "pydantic>=2.12.2",
    "python-dotenv>=1.1.1",
    "python-jose[cryptography]>=3.5.0",
    "python-json-logger>=4.0.0",
    "requests>=2.32.5",
    "slowapi>=0.1.9",
    "sqlmodel>=0.0.27",
    "uvicorn[standard]>=0.37.0",
]

[project.optional-dependencies]
test = [
    "httpx>=0.28.0",
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]
# Minimal runtime for the containerized data pipeline (no FastAPI stack).
pipeline = [
    "duckdb>=1.4.1",
    "pandas>=2.3.3",
    "requests>=2.32.5",
]

[tool.uv.sources]
klima-schema = { path = "../schema", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.isort]
profile = "black"
line_length = 88
combine_as_imports = true
multi_line_output = 3
include_trailing_comma = true

[tool.ruff]
line-length = 88
fix = false
lint.select = ["E", "F", "W", "I"]   # Ruff rule codes: style, pyflakes, etc.
exclude = ["venv/*", "build/*", "dist/*", "__pycache__/*", "pipeline/*"]
